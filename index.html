<!DOCTYPE html>
<html>

<head>

    <title>AutoBill Checkout</title>

    <link rel="stylesheet" href="style.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

    <!-- ========================================= -->
    <!-- 🛒 TITLE -->
    <!-- ========================================= -->

    <h1>🛒 AutoBill Checkout System</h1>

    <!-- ========================================= -->
    <!-- 📦 LIVE CART -->
    <!-- ========================================= -->

    <div id="home"></div>

    <!-- ========================================= -->
    <!-- 💰 TOTAL -->
    <!-- ========================================= -->

    <h2 id="totalText">CHECKOUT RM 0</h2>

    <!-- ========================================= -->
    <!-- 🧾 CHECKOUT BUTTON -->
    <!-- ========================================= -->

    <button id="checkoutBtn" onclick="checkout()">
        Checkout
    </button>

    <!-- ========================================= -->
    <!-- 💳 QR SECTION -->
    <!-- ========================================= -->

    <div id="qr-section">

        <h2>📱 Scan To Pay</h2>

        <img src="qr.jpeg" id="qr-image">

        <h3>Touch 'n Go eWallet</h3>

        <p>
            Scan using banking apps or eWallet
        </p>

        <!-- NEXT BUTTON -->
        <button id="nextBtn" onclick="nextStep()">
            Next
        </button>

        <!-- VERIFYING -->
        <h3 id="verifyingText">
            ⏳ Verifying Payment...
        </h3>

    </div>

    <!-- ========================================= -->
    <!-- ✅ THANK YOU -->
    <!-- ========================================= -->

    <div id="success-message">

        <h1>✅ Thank You For Shopping With Us</h1>

    </div>

    <!-- ========================================= -->
    <!-- 📚 SCRIPTS -->
    <!-- ========================================= -->

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script src="app.js"></script>

</body>

</html>
